  <!-- Artist Palette & AI Spark / Brush -->
  <path d="M256 115 C165 115 95 180 95 265 C95 348 165 405 235 405 C262 405 280 385 280 362 C280 348 272 338 272 325 C272 310 285 298 302 298 L335 298 C385 298 417 262 417 215 C417 155 345 115 256 115 Z" 
