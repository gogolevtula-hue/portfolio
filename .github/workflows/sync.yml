name: Sync Dropbox Portfolio

on:
  schedule:
    - cron: '0 6 * * *' # Запускается каждый день автоматически
  workflow_dispatch:     # Позволяет запускать вручную кнопкой

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install dropbox Pillow

      - name: Sync images from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python sync_dropbox.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/ images.json
          git diff --staged --quiet || (git commit -m "Auto-sync portfolio from Dropbox" && git push)
