<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё Портфолио</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    header { max-width: 1200px; margin: 0 auto 40px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    p.subtitle { color: #94a3b8; font-size: 1.1rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; overflow: hidden; transition: transform 0.25s, box-shadow 0.25s; cursor: pointer; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(0,0,0,0.4); }
    .card img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: top center; display: block; }
    .card-title { padding: 14px 16px; font-size: 0.95rem; line-height: 1.4; color: #e2e8f0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lightbox { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 82vh; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    .lightbox-caption { margin-top: 16px; font-size: 1.1rem; color: #f8fafc; text-align: center; max-width: 800px; }
    .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: #fff; border: none; font-size: 2rem; padding: 12px 18px; cursor: pointer; border-radius: 50%; transition: background 0.2s; }
    .nav-btn:hover { background: rgba(255,255,255,0.25); }
    .prev-btn { left: 20px; }
    .next-btn { right: 20px; }
    .close-btn { position: absolute; top: 20px; right: 25px; font-size: 2rem; color: #94a3b8; cursor: pointer; background: none; border: none; }
    .close-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Мои работы</h1>
    <p class="subtitle">Галерея обновляется автоматически</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script>
    let portfolioItems = [];
    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function changeImage(step) {
      currentIndex = (currentIndex + step + portfolioItems.length) % portfolioItems.length;
      updateLightbox();
    }

    function updateLightbox() {
      const item = portfolioItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

    fetch('images.json?t=' + Date.now())
      .then(res => res.json())
      .then(images => {
        portfolioItems = images;
        const gallery = document.getElementById('gallery');
        if (!images.length) throw new Error();
        images.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openLightbox(index);
          card.innerHTML = `<img src="${item.src}" alt="${item.title}" loading="lazy"><div class="card-title">${item.title}</div>`;
          gallery.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('gallery').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#94a3b8;">Изображения скоро появятся...</p>';
      });
  </script>
</body>
</html>
