<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дмитрий Гоголев — Нейрохудожник</title>
  <style>
    /* Дневной режим (светлая тема) */
    :root {
      --bg: #f8f4fb;
      --surface: rgba(255, 255, 255, 0.82);
      --card-bg: #ffffff;
      --text: #1f0929;
      --text-muted: #6b4c7b;
      --border: rgba(192, 38, 211, 0.18);
      --accent: linear-gradient(135deg, #d946ef 0%, #9333ea 50%, #4f46e5 100%);
      --accent-solid: #c026d3;
      --accent-text: #ffffff;
      --glow-1: rgba(217, 70, 239, 0.08);
      --glow-2: rgba(147, 51, 234, 0.06);
      --glow-3: rgba(79, 70, 229, 0.05);
      --grid-line: rgba(192, 38, 211, 0.04);
      --node-color: 168, 85, 247;
      --node-opacity: 0.22;
    }

    /* Ночной режим (тёмная киберпанк-фуксия тема) */
    [data-theme="dark"] {
      --bg: #070210;
      --surface: rgba(24, 10, 44, 0.65);
      --card-bg: rgba(32, 14, 58, 0.88);
      --text: #fdfaff;
      --text-muted: #cfaee0;
      --border: rgba(217, 70, 239, 0.28);
      --accent: linear-gradient(135deg, #f43f5e 0%, #d946ef 50%, #8b5cf6 100%);
      --accent-solid: #d946ef;
      --accent-text: #ffffff;
      --glow-1: rgba(217, 70, 239, 0.22);
      --glow-2: rgba(162, 28, 175, 0.16);
      --glow-3: rgba(99, 102, 241, 0.14);
      --grid-line: rgba(217, 70, 239, 0.05);
      --node-color: 232, 121, 249;
      --node-opacity: 0.55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 40px 90px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновая сетка и неоновое свечение */
    .neural-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    .neural-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      animation: floatOrb 22s infinite alternate ease-in-out;
    }

    .orb-1 { width: 550px; height: 550px; background: var(--glow-1); top: -120px; left: -100px; }
    .orb-2 { width: 480px; height: 480px; background: var(--glow-2); top: 30%; right: -120px; animation-delay: -7s; animation-duration: 26s; }
    .orb-3 { width: 420px; height: 420px; background: var(--glow-3); bottom: -100px; left: 25%; animation-delay: -13s; animation-duration: 30s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.12); }
      100% { transform: translate(-40px, 70px) scale(0.94); }
    }

    #neural-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .container { max-width: 1440px; margin: 0 auto; position: relative; z-index: 1; }

    /* Верхняя шапка с логотипом БЕЗ рамки */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
    }

    .logo-banner-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .logo-banner-img {
      display: block;
      height: 140px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      background: transparent;
      border: none;
      box-shadow: none;
      filter: drop-shadow(0 4px 18px rgba(217, 70, 239, 0.35));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    :root:not([data-theme="dark"]) .logo-banner-img {
      filter: drop-shadow(0 2px 6px rgba(31, 9, 41, 0.55)) drop-shadow(0 4px 16px rgba(192, 38, 211, 0.35));
    }

    .logo-banner-link:hover .logo-banner-img {
      transform: scale(1.02);
    }

    /* Главный заголовок */
    header {
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .hero-title {
      font-size: clamp(2.4rem, 4.8vw, 4.2rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    .hero-subtitle {
      margin-top: 14px;
      font-size: 0.98rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* Вкладки и переключение сетки */
    .subheader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .tabs-left {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-item {
      color: var(--text-muted);
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      user-select: none;
    }

    .tab-item:hover {
      color: var(--text);
      border-color: var(--accent-solid);
      transform: translateY(-1px);
    }

    .tab-item.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: transparent;
      box-shadow: 0 6px 16px rgba(217, 70, 239, 0.32);
    }

    .view-mode-toggle {
      display: inline-flex;
      background: var(--surface);
      backdrop-filter: blur(12px);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .view-btn {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 500;
    }

    .view-btn:hover { color: var(--text); }

    .view-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 2px 8px rgba(217, 70, 239, 0.25);
    }

    /* Галерея */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 36px 28px;
    }

    .gallery.compact { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 22px 16px; }
    .gallery.large { grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 48px 36px; }

    .card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--surface);
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .card:hover .card-img-wrap {
      border-color: var(--accent-solid);
      box-shadow: 0 10px 28px rgba(217, 70, 239, 0.25);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover img { transform: scale(1.04); }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(24, 8, 38, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(217, 70, 239, 0.3);
      letter-spacing: 0.04em;
    }

    .card-title {
      margin-top: 12px;
      font-size: 0.92rem;
      color: var(--text);
      font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Полноэкранный просмотр */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 3, 18, 0.96);
      backdrop-filter: blur(14px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 30px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 82vh; border-radius: 10px; object-fit: contain; box-shadow: 0 10px 45px rgba(217,70,239,0.25); }
    .lightbox-caption { margin-top: 18px; font-size: 1.05rem; color: #f1f5f9; text-align: center; }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(217,70,239,0.18); color: #fff; border: 1px solid rgba(217,70,239,0.35);
      font-size: 1.6rem; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-btn:hover { background: rgba(217,70,239,0.35); }
    .prev-btn { left: 25px; } .next-btn { right: 25px; }
    .close-btn { position: absolute; top: 25px; right: 30px; font-size: 2.2rem; color: #cbd5e1; cursor: pointer; background: none; border: none; }

    /* Одиночная компактная кнопка переключения темы */
    .theme-toggle-fixed {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(217, 70, 239, 0.35);
      z-index: 999;
      letter-spacing: 0.03em;
    }

    .theme-toggle-fixed:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(217, 70, 239, 0.5);
    }

    /* Кнопка наверх */
    .scroll-top-btn {
      position: fixed;
      bottom: 82px;
      right: 25px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(217, 70, 239, 0.35);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    }

    .scroll-top-btn.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    .scroll-top-btn:hover { transform: translateY(-3px); }

    @media (max-width: 768px) {
      body { padding: 24px 18px 80px; }
      .logo-banner-img { height: 100px; }
      .gallery.large { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="neural-bg">
    <div class="neural-orb orb-1"></div>
    <div class="neural-orb orb-2"></div>
    <div class="neural-orb orb-3"></div>
  </div>
  <canvas id="neural-canvas"></canvas>

  <div class="container">
    <div class="top-bar">
      <a href="#" class="logo-banner-link" title="Дмитрий Гоголев — Нейрохудожник">
        <img
          id="site-logo"
          src="Gemini_Generated_Image_di3q1zdi3q1zdi3q.jpg"
          onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='logo.png';}"
          alt="Дмитрий Гоголев — Нейрохудожник"
          class="logo-banner-img"
        >
      </a>
    </div>

    <header>
      <h1 class="hero-title">Свет. Чувство.<br>История.</h1>
      <p class="hero-subtitle">Визуальные миры и образы, созданные нейрохудожником Дмитрием Гоголевым</p>
    </header>

    <div class="subheader">
      <div class="tabs-left" id="unified-tabs"></div>
      <div class="view-mode-toggle">
        <button class="view-btn active" data-mode="normal" onclick="setGrid('normal')">Обычные</button>
        <button class="view-btn" data-mode="large" onclick="setGrid('large')">Крупные</button>
        <button class="view-btn" data-mode="compact" onclick="setGrid('compact')">Компактные</button>
      </div>
    </div>

    <main class="gallery" id="gallery"></main>
  </div>

  <button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" title="Наверх" aria-label="Наверх">&#8593;</button>
  <button class="theme-toggle-fixed" id="theme-btn" onclick="toggleTheme()">🌙 Ночной режим</button>

  <div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script>
    let allItems = [];
    let currentFilteredItems = [];
    let currentIndex = 0;
    let activeTab = null;

    // Автоматическое удаление тёмного фона у логотипа и обрезка пустых полей
    function makeLogoTransparent() {
      const img = document.getElementById('site-logo');
      if (!img) return;

      const process = () => {
        if (img.dataset.processed) return;
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const w = img.naturalWidth;
          const h = img.naturalHeight;
          if (!w || !h) return;

          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0);

          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;

          // Определяем цвет фона по угловому пикселю
          const bgR = d[0], bgG = d[1], bgB = d[2];

          let minX = w, minY = h, maxX = 0, maxY = 0;

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const idx = (y * w + x) * 4;
              const r = d[idx], g = d[idx + 1], b = d[idx + 2];

              const dist = Math.hypot(r - bgR, g - bgG, b - bgB);
              const maxChannel = Math.max(r, g, b);

              if (dist < 28 && maxChannel < 65) {
                d[idx + 3] = 0;
              } else if (dist < 85) {
                const alpha = Math.min(1, (dist - 28) / 57);
                d[idx + 3] = Math.round(alpha * 255);
              }

              if (d[idx + 3] > 15) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }

          ctx.putImageData(imgData, 0, 0);

          // Аккуратно кадрируем лишние пустые края вокруг логотипа
          const pad = 16;
          minX = Math.max(0, minX - pad);
          minY = Math.max(0, minY - pad);
          maxX = Math.min(w - 1, maxX + pad);
          maxY = Math.min(h - 1, maxY + pad);

          const cropW = maxX - minX + 1;
          const cropH = maxY - minY + 1;

          if (cropW > 0 && cropH > 0) {
            const outCanvas = document.createElement('canvas');
            outCanvas.width = cropW;
            outCanvas.height = cropH;
            outCanvas.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
            img.dataset.processed = '1';
            img.src = outCanvas.toDataURL('image/png');
          }
        } catch (e) {
          // Если браузер открыт локально без сервера, оставляем как есть
        }
      };

      if (img.complete && img.naturalWidth) {
        process();
      } else {
        img.addEventListener('load', process, { once: true });
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 350) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });

    function setGrid(mode) {
      const gallery = document.getElementById('gallery');
      gallery.className = 'gallery';
      if (mode !== 'normal') gallery.classList.add(mode);
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      localStorage.setItem('portfolio_grid', mode);
    }

    function applyTheme(mode) {
      const html = document.documentElement;
      const btn = document.getElementById('theme-btn');
      if (mode === 'light') {
        html.removeAttribute('data-theme');
        btn.textContent = '☀️ Дневной режим';
        localStorage.setItem('portfolio_theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '🌙 Ночной режим';
        localStorage.setItem('portfolio_theme', 'dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    }

    function applyFilter() {
      currentFilteredItems = allItems.filter(item => {
        if (!activeTab) return true;
        if (activeTab.type === 'all') return true;
        if (activeTab.type === 'folder') return item.folder === activeTab.value;
        if (activeTab.type === 'category') return item.category === activeTab.value;
        return true;
      });
      renderGallery(currentFilteredItems);
    }

    function renderGallery(items) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      if (!items.length) {
        gallery.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">В этой категории пока нет работ.</p>';
        return;
      }
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openLightbox(index);
        const badgeNum = String(index + 1).padStart(2, '0');
        card.innerHTML = `
          <div class="card-img-wrap">
            <span class="card-badge">${badgeNum}</span>
            <img src="${item.src}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-title">${item.title}</div>
        `;
        gallery.appendChild(card);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      const item = currentFilteredItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
    function changeImage(step) {
      currentIndex = (currentIndex + step + currentFilteredItems.length) % currentFilteredItems.length;
      const item = currentFilteredItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

    function initNeuralCanvas() {
      const canvas = document.getElementById('neural-canvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      const nodes = [];
      const nodeCount = Math.min(50, Math.floor((width * height) / 26000));
      const mouse = { x: -1000, y: -1000 };

      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 2 + 1.2
        });
      }

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const style = getComputedStyle(document.documentElement);
        const rgb = style.getPropertyValue('--node-color').trim() || '217, 70, 239';
        const op = parseFloat(style.getPropertyValue('--node-opacity').trim() || '0.3');

        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          n.x += n.vx;
          n.y += n.vy;

          if (n.x < 0 || n.x > width) n.vx *= -1;
          if (n.y < 0 || n.y > height) n.vy *= -1;

          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${rgb}, ${Math.min(1, op * 1.4)})`;
          ctx.fill();

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dist = Math.hypot(n.x - n2.x, n.y - n2.y);
            if (dist < 160) {
              const alpha = (1 - dist / 160) * op;
              ctx.beginPath();
              ctx.moveTo(n.x, n.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.strokeStyle = `rgba(${rgb}, ${alpha})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          const mDist = Math.hypot(n.x - mouse.x, n.y - mouse.y);
          if (mDist < 190) {
            const alpha = (1 - mDist / 190) * Math.min(1, op * 1.5);
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = `rgba(${rgb}, ${alpha})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    window.addEventListener('DOMContentLoaded', () => {
      makeLogoTransparent();
      initNeuralCanvas();

      const savedTheme = localStorage.getItem('portfolio_theme') || 'dark';
      applyTheme(savedTheme);

      const savedGrid = localStorage.getItem('portfolio_grid');
      if (savedGrid) setGrid(savedGrid);

      fetch('images.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          allItems = data;
          const tabsContainer = document.getElementById('unified-tabs');
          tabsContainer.innerHTML = '';

          const tabItems = [];
          const seenFolders = new Set();
          data.forEach(item => {
            if (item.folder !== 'all' && !seenFolders.has(item.folder)) {
              seenFolders.add(item.folder);
              tabItems.push({ name: item.folderName, type: 'folder', value: item.folder });
            }
          });

          tabItems.push({ name: 'Все работы', type: 'all', value: 'all' });

          tabItems.forEach((tabObj, idx) => {
            const tab = document.createElement('span');
            tab.className = 'tab-item';
            tab.textContent = tabObj.name;
            tab.onclick = () => {
              document.querySelectorAll('#unified-tabs .tab-item').forEach(el => el.classList.remove('active'));
              tab.classList.add('active');
              activeTab = tabObj;
              applyFilter();
            };
            tabsContainer.appendChild(tab);

            if (idx === 0) {
              tab.classList.add('active');
              activeTab = tabObj;
            }
          });

          applyFilter();
        })
        .catch(() => {
          document.getElementById('gallery').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Изображения скоро появятся...</p>';
        });
    });
  </script>
</body>
</html>
