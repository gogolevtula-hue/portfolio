<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дмитрий Гоголев — Фотохудожник</title>
  <style>
    :root {
      --bg: #f4f3ee;
      --card-bg: #f4f3ee;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e0;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 50px 40px;
      min-height: 100vh;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    /* Верхняя шапка с логотипом */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.05em;
      font-family: serif;
    }

    .logo-text {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1.3;
    }

    .logo-text span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
