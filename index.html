<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дмитрий Гоголев — Фотохудожник</title>
  <style>
    :root {
      --bg: #f4f3ee;
      --card-bg: #f4f3ee;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e0;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 50px 40px;
      min-height: 100vh;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    /* Верхняя шапка с логотипом */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 60px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: -0.05em;
      font-family: serif;
    }

    .logo-text {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text);
      line-height: 1.3;
    }

    .logo-text span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    /* Главный заголовок */
    header {
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 30px;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    /* Единая строка вкладок */
    .subheader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .tabs-left {
      display: flex;
      gap: 28px;
      font-size: 0.95rem;
      font-weight: 500;
      flex-wrap: wrap;
      align-items: center;
    }

    .tab-item {
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 4px;
    }

    .tab-item.active {
      color: var(--text);
      border-bottom: 2px solid var(--text);
    }

    .view-mode-toggle {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      gap: 15px;
    }

    .view-mode-toggle span:hover { color: var(--text); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px 30px;
    }

    .gallery.compact { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px 16px; }
    .gallery.large { grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 60px 40px; }

    .card { cursor: pointer; display: flex; flex-direction: column; }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--border);
      overflow: hidden;
      border-radius: 8px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover img { transform: scale(1.02); }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .card-title {
      margin-top: 12px;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 30px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 4px; object-fit: contain; }
    .lightbox-caption { margin-top: 20px; font-size: 1.1rem; color: #fff; text-align: center; }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); color: #fff; border: none;
      font-size: 1.8rem; width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .prev-btn { left: 25px; } .next-btn { right: 25px; }
    .close-btn { position: absolute; top: 25px; right: 30px; font-size: 2.2rem; color: #aaa; cursor: pointer; background: none; border: none; }

    .theme-toggle-fixed {
      position: fixed; bottom: 25px; right: 25px;
      background: var(--text); color: var(--bg); border: none;
      padding: 12px 20px; border-radius: 30px; cursor: pointer; font-weight: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="logo-area">
        <div class="logo-icon">дг.</div>
        <div class="logo-text">
          Дмитрий Гоголев
          <span>Фотохудожник</span>
        </div>
      </div>
    </div>

    <header>
      <h1 class="hero-title">Свет. Чувство.<br>История.</h1>
    </header>

    <div class="subheader">
      <div class="tabs-left" id="unified-tabs"></div>
      <div class="view-mode-toggle">
        <span onclick="setGrid('normal')">[ Обычные ]</span>
        <span onclick="setGrid('large')">[ Крупные ]</span>
        <span onclick="setGrid('compact')">[ Компактные ]</span>
      </div>
    </div>

    <main class="gallery" id="gallery"></main>
  </div>

  <button class="theme-toggle-fixed" onclick="toggleTheme()" id="theme-btn">🌙 Ночной режим</button>

  <div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script>
    let allItems = [];
    let currentFilteredItems = [];
    let currentIndex = 0;
    let activeTab = null;

    function setGrid(mode) {
      const gallery = document.getElementById('gallery');
      gallery.className = 'gallery';
      if (mode !== 'normal') gallery.classList.add(mode);
      localStorage.setItem('portfolio_grid', mode);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) {
        html.removeAttribute('data-theme');
        localStorage.setItem('portfolio_theme', 'light');
        document.getElementById('theme-btn').textContent = '🌙 Ночной режим';
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('portfolio_theme', 'dark');
        document.getElementById('theme-btn').textContent = '☀️ Дневной режим';
      }
    }

    function applyFilter() {
      currentFilteredItems = allItems.filter(item => {
        if (!activeTab) return true;
        if (activeTab.type === 'all') return true;
        if (activeTab.type === 'folder') return item.folder === activeTab.value;
        if (activeTab.type === 'category') return item.category === activeTab.value;
        return true;
      });
      renderGallery(currentFilteredItems);
    }

    function renderGallery(items) {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      if (!items.length) {
        gallery.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">В этой категории пока нет работ.</p>';
        return;
      }
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openLightbox(index);
        const badgeNum = String(index + 1).padStart(2, '0');
        card.innerHTML = `
          <div class="card-img-wrap">
            <span class="card-badge">${badgeNum}</span>
            <img src="${item.src}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-title">${item.title}</div>
        `;
        gallery.appendChild(card);
      });
    }

    function openLightbox(index) {
      currentIndex = index;
      const item = currentFilteredItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
    function changeImage(step) {
      currentIndex = (currentIndex + step + currentFilteredItems.length) % currentFilteredItems.length;
      const item = currentFilteredItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('portfolio_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-btn').textContent = '☀️ Дневной режим';
      }
      const savedGrid = localStorage.getItem('portfolio_grid');
      if (savedGrid) setGrid(savedGrid);

      fetch('images.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          allItems = data;
          const tabsContainer = document.getElementById('unified-tabs');
          tabsContainer.innerHTML = '';

          const tabItems = [];

          // 1. Вкладка "Портрет"
          const hasPortrait = data.some(item => item.category === 'portrait');
          if (hasPortrait) {
            tabItems.push({ name: 'Портрет', type: 'category', value: 'portrait' });
          }

          // 2. Уникальные папки из Dropbox
          const seenFolders = new Set();
          data.forEach(item => {
            if (item.folder !== 'all' && !seenFolders.has(item.folder)) {
              seenFolders.add(item.folder);
              tabItems.push({ name: item.folderName, type: 'folder', value: item.folder });
            }
          });

          // 3. "Все работы" ВСЕГДА В САМОМ КОНЦЕ
          tabItems.push({ name: 'Все работы', type: 'all', value: 'all' });

          tabItems.forEach((tabObj, idx) => {
            const tab = document.createElement('span');
            tab.className = 'tab-item';
            tab.textContent = tabObj.name;
            tab.onclick = () => {
              document.querySelectorAll('#unified-tabs .tab-item').forEach(el => el.classList.remove('active'));
              tab.classList.add('active');
              activeTab = tabObj;
              applyFilter();
            };
            tabsContainer.appendChild(tab);

            if (idx === 0) {
              tab.classList.add('active');
              activeTab = tabObj;
            }
          });

          applyFilter();
        })
        .catch(() => {
          document.getElementById('gallery').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Изображения скоро появятся...</p>';
        });
    });
  </script>
</body>
</html>
