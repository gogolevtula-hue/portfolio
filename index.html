<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свет. Чувство. История. — Портфолио</title>
  <style>
    :root {
      --bg: #f4f3ee; /* Точный кремовый цвет с вашего образца */
      --card-bg: #f4f3ee;
      --text: #1a1a1a;
      --text-muted: #666666;
      --border: #e5e5e0;
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 60px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 30px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .hero-desc {
      max-width: 340px;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .hero-desc span.star {
      font-size: 1.2rem;
      color: var(--text);
      display: inline-block;
      margin-bottom: 4px;
    }

    .hero-desc a.link {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      margin-top: 10px;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
    }

    .subheader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .tabs-left {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .tab-item {
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 4px;
    }

    .tab-item.active {
      color: var(--text);
      border-bottom: 2px solid var(--text);
    }

    .view-mode-toggle {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      gap: 15px;
    }

    .view-mode-toggle span:hover { color: var(--text); }

    .collection-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .collection-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filters-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 40px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .filter-chip {
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .filter-chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px 30px;
    }

    .gallery.compact {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px 16px;
    }

    .gallery.large {
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 60px 40px;
    }

    /* Карточка без внешних рамок и фона */
    .card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: var(--border);
      overflow: hidden;
      border-radius: 8px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.02);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .card-title {
      margin-top: 12px;
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 30px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 4px;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 20px;
      font-size: 1.1rem;
      color: #fff;
      text-align: center;
      font-weight: 300;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.25); }
    .prev-btn { left: 25px; }
    .next-btn { right: 25px; }
    .close-btn {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 2.2rem;
      color: #aaa;
      cursor: pointer;
      background: none;
      border: none;
    }
    .close-btn:hover { color: #fff; }

    .theme-toggle-fixed {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--text);
      color: var(--bg);
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 999;
    }

    @media (max-width: 768px) {
      body { padding: 20px 12px; }
      header { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 class="hero-title">Свет. Чувство.<br>История.</h1>
      </div>
      <div class="hero-desc">
        <span class="star">✱</span><br>
        Портреты, постановочные истории и пространство для воображения. Каждый кадр — способ почувствовать.<br>
        <a href="#" class="link" onclick="window.scrollTo({top: 400, behavior: 'smooth'}); return false;">Смотреть работы ∨</a>
      </div>
    </header>

    <div class="subheader">
      <div class="tabs-left">
        <span class="tab-item active">Все работы</span>
        <span class="tab-item" style="color:var(--text-muted)">Наши фотографии</span>
      </div>
      <div class="view-mode-toggle">
        <span onclick="setGrid('normal')">[ Обычные ]</span>
        <span onclick="setGrid('large')">[ Крупные ]</span>
        <span onclick="setGrid('compact')">[ Компактные ]</span>
      </div>
    </div>

    <div class="collection-row">
      <div class="collection-title">Коллекция работ</div>
    </div>

    <div class="filters-bar">
      <div class="filter-chip active">Все работы</div>
      <div class="filter-chip">Портрет</div>
      <div class="filter-chip">Кино</div>
      <div class="filter-chip">Fashion</div>
      <div class="filter-chip">Lifestyle</div>
      <div class="filter-chip">Нуар</div>
    </div>

    <main class="gallery" id="gallery"></main>
  </div>

  <button class="theme-toggle-fixed" onclick="toggleTheme()" id="theme-btn">🌙 Ночной режим</button>

  <div class="lightbox" id="lightbox" onclick="if(event.target === this) closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">&times;</button>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script>
    let portfolioItems = [];
    let currentIndex = 0;

    function setGrid(mode) {
      const gallery = document.getElementById('gallery');
      gallery.className = 'gallery';
      if (mode !== 'normal') gallery.classList.add(mode);
      localStorage.setItem('portfolio_grid', mode);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      if (isDark) {
        html.removeAttribute('data-theme');
        localStorage.setItem('portfolio_theme', 'light');
        document.getElementById('theme-btn').textContent = '🌙 Ночной режим';
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('portfolio_theme', 'dark');
        document.getElementById('theme-btn').textContent = '☀️ Дневной режим';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('portfolio_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-btn').textContent = '☀️ Дневной режим';
      }
      const savedGrid = localStorage.getItem('portfolio_grid');
      if (savedGrid) setGrid(savedGrid);
    });

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function changeImage(step) {
      currentIndex = (currentIndex + step + portfolioItems.length) % portfolioItems.length;
      updateLightbox();
    }

    function updateLightbox() {
      const item = portfolioItems[currentIndex];
      document.getElementById('lightbox-img').src = item.src;
      document.getElementById('lightbox-caption').textContent = item.title;
    }

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

    fetch('images.json?t=' + Date.now())
      .then(res => res.json())
      .then(images => {
        portfolioItems = images;
        const gallery = document.getElementById('gallery');
        if (!images.length) throw new Error();
        images.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openLightbox(index);
          const badgeNum = String(index + 1).padStart(2, '0');
          card.innerHTML = `
            <div class="card-img-wrap">
              <span class="card-badge">${badgeNum}</span>
              <img src="${item.src}" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-title">${item.title}</div>
          `;
          gallery.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('gallery').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Изображения скоро появятся...</p>';
      });
  </script>
</body>
</html>
