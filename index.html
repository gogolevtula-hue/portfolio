<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё Портфолио</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 40px 20px; }
    header { max-width: 1200px; margin: 0 auto 40px; text-align: center; }
    h1 { font-size: 2.5rem; margin-bottom: 10px; }
    p.subtitle { color: #94a3b8; font-size: 1.1rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 260px; object-fit: cover; display: block; }
    .card-title { padding: 12px 16px; font-size: 0.95rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 95%; max-height: 92vh; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Мои работы</h1>
    <p class="subtitle">Галерея обновляется автоматически</p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    fetch('images.json?t=' + Date.now())
      .then(res => res.json())
      .then(images => {
        const gallery = document.getElementById('gallery');
        if (!images.length) throw new Error();
        images.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => {
            document.getElementById('lightbox-img').src = item.src;
            document.getElementById('lightbox').classList.add('active');
          };
          card.innerHTML = `<img src="${item.src}" alt="${item.title}" loading="lazy"><div class="card-title">${item.title}</div>`;
          gallery.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('gallery').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#94a3b8;">Изображения скоро появятся...</p>';
      });
  </script>
</body>
</html>
